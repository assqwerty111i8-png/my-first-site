<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Soon...</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="nav-en"></div>

    <h1 class="center">Soon...</h1>

    <div id="footer-en"></div>

    <script>
        // Load navigation
        fetch('nav-en.html')
            .then(response => response.text())
            .then(data => {
                const nav = document.getElementById('nav-en');
                if (nav) nav.innerHTML = data;
            })
            .catch(error => console.error('Error loading nav:', error));

        // Load footer
        fetch('footer-en.html')
            .then(response => response.text())
            .then(data => {
                const footer = document.getElementById('footer-en');
                if (footer) footer.innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>

</body>
</html>
