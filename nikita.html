<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>О брате</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="nav"></div>

    <h1 class="center">Информация о моем брате</h1>

    <p>Он тоже сейчас изучает сайты, создание игр.</p>
    <p>Он любит кидать котлеты в окно 😂</p>
    <p>Тут будут его проекты.</p>

    <img src="images/Cotleta.jpg" alt="Котлета">

    <div id="footer"></div>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav').innerHTML = data;
            });

        fetch('footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });
    </script>

</body>
</html>
