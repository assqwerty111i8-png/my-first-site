<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About my brother</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="nav-en"></div>

    <h1 class="center">Information about my brother</h1>

    <p>He is also currently learning web development and game creation.</p>
    <p>He loves throwing meatballs out the window 😂</p>
    <p>His projects will be showcased here.</p>

    <img src="images/Cotleta.jpg" alt="Meatball">

    <div id="footer-en"></div>

    <script>
        fetch('nav-en.html')
            .then(r => r.text())
            .then(data => {
                const nav = document.getElementById('nav-en');
                if (nav) nav.innerHTML = data;
            });

        fetch('footer-en.html')
            .then(r => r.text())
            .then(data => {
                const footer = document.getElementById('footer-en');
                if (footer) footer.innerHTML = data;
            });
    </script>

</body>
</html>
