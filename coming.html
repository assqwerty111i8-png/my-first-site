<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Скоро...</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="nav"></div>

    <h1 class="center">Скоро...</h1>

    <div id="footer"></div>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav').innerHTML = data;
            });

        fetch('footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });
    </script>

</body>
</html>
